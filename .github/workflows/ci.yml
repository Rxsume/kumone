      - uses: actions/checkout@v4

      - name: Test (${{ matrix.name }})
        run: ${{ matrix.run }}

  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # Same invocation as release.yml, minus signing / notarization: the
      # script's own ad-hoc signature is all an unsigned build gets.
      - name: Build app (universal, unsigned)
        run: |
          ARCHES="arm64 x86_64" FETCH_MLX_METALLIB=1 \
            Scripts/build-app.sh release

      # Compile the iOS app shell unsigned. Same xcodebuild invocation as the
      # unsigned IPA workflow, without packaging; version overrides are
      # unnecessary for a compile check, so the xcconfig defaults apply.
      - name: Build iOS app (unsigned)
        run: |
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
