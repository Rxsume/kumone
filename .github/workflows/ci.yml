name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # Split in two on purpose. The two playback suites below are the only
      # ones driving AVAudioEngine through runWithWatchdog, and on the
      # 3-thread CI runner the whole target oversubscribes Swift's
      # cooperative pool (upstream 9e24dc1 documents the same starvation:
      # "CPU-heavy analyzer suites holding the rest of the pool"). A plain
      # `swift test` timed out five times at the 45-minute cap — first in
      # outgoingDeckStaysSilentAfterTransition's stereo case, then, once
      # that case was dropped, in the last test of the same suite — with no
      # watchdog timeout ever printing, i.e. the test task never got a pool
      # thread to start on. Running the playback suites in their own
      # invocation gives them the pool to themselves and keeps them out of
      # contention with the other ~120 suites. The 60-minute job cap above
      # is headroom for the split's extra startup, not a fix for the hang:
      # a stalled run is silent indefinitely, so a higher cap alone would
      # only burn more minutes.
      - name: Test
        run: swift test --skip 'PlaybackEngineSmokeTests|TransitionSegmentTests'

      - name: Test (playback suites)
        run: swift test --filter 'PlaybackEngineSmokeTests|TransitionSegmentTests'

      # Same invocation as release.yml, minus signing / notarization: the
      # script's own ad-hoc signature is all an unsigned build gets.
      - name: Build app (universal, unsigned)
        run: |
          ARCHES="arm64 x86_64" FETCH_MLX_METALLIB=1 \
            Scripts/build-app.sh release

      # Compile the iOS app shell unsigned. Same xcodebuild invocation as the
      # unsigned IPA workflow, without packaging; version overrides are
      # unnecessary for a compile check, so the xcconfig defaults apply.
      - name: Build iOS app (unsigned)
        run: |
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
