          - name: suites Q-S1
            run: "swift test --skip 'AccountIsolationTests|AdmissionGateTests|AnalysisStoreTests|AppearanceHexTests|AudioCacheEvictionTests|AudioCacheTests|AudioOutputDeviceTests|AudioSourceTrackMatcherTests|AuditionPlanOverrideTests|AutoMixDebugModelTests|AutoMixSettingsTests|AutomaticCacheLimitTests|BackgroundDownloadTransportTests|BeansCoverPaletteTests|BedIntroCompileTests|BedSplitTests|CDNHostTests|ChainCoherenceTests|CheckpointShapeTests|CustomAudioSourceTests|DeckChainDSPResetTests|DeckChainTimePitchBypassTests|DeviceIDTests|DistributionChannelTests|DownloadEligibilityTests|DownloadManagerTests|EngineAudioCacheDownloadTests|EngineDumpThrottleTests|EngineResurrectionSentinelTests|EngineTraceCoalesceTests|EngineTraceRenderTests|EngineTraceRingHygieneTests|EngineTraceRingTests|FoliaIOSPureLogicTests|FoliaMacPlaybackSettingsTests|FoliaMasterSwitchTests|FoliaPlaybackSettingsTests|GestureLibraryByteIdentityTests|HeadLatencyOverrideTests|HiddenAppWindowsTests|ImageCacheClearTests|ImageThumbnailTests|KumoneObjCTests|LatticePlayerTests|LayoutSizeClassTests|LoudnessCompensationTests|LoudnessMeterTests|LuminousPlayerTests|LyricFilterTests|LyricMatchTests|LyricsParserTests|LyricsSidecarTests|MasterLimiterTests|ModelManifestTests|ModelReleaseTests|NavigationDestinationTests|NowPlayingArtworkStoreTests|OfflineArtworkTests|OfflineMetadataCleanupTests|OfflineStoreTests|OfflineUIFixtureTests|OutputRouteChangeDamperTests|OverloadTraceLineTests|PauseDrainTests|PlatformTrackLyricsTests|PlaybackEngineSmokeTests|PlaybackQueuePlanTests|PlaybackRepositoryTests|PlaybackRescheduleCheckTests|PlaybackStallCheckTests|PlaybackStartErrorCheckTests|PlaybackStateStorageTests|PlaylistAddErrorTests|PlaylistLoadingTests|PlaylistPublicationTests|PlaylistSearchTests|PreparedDeckTests|ProgressiveAudioBufferTests|ProgressiveLoaderFLACTests|SegmentTimelineAlignmentTests|SettingsBackupTests|ShortcutSettingsTests|SlamAndTensionCutCompileTests|SleepTimerTests|StemEnvelopeTests|StemMetalResourcesTests|S