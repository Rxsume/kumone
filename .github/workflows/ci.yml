name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # Split in four on purpose. A plain `swift test` stalls this target
      # on the 3-thread CI runner: runs #136/#137 both printed test output
      # for only ~30 s (the documented ~30 s cooperative-pool backlog at
      # the start of a run — see EventLog in PlaybackEngineSmokeTests),
      # then went completely silent for ~85 min until the 90-min cap
      # killed them, with no test failing. The stuck test set moves
      # between runs (#136: StemModelDownloaderStateTests/TestWatchdog;
      # #137: four unrelated tests in DownloadManager/StemModelDownloader/
      # ProgressiveLoaderFLAC/OfflineArtwork), so no single test is the
      # cause — they are victims of cooperative-pool oversubscription:
      # hundreds of tests queue at once, synchronous CPU-bound work
      # (TrackAnalyzer full-track decodes, loudness/stem suites) and
      # synchronous blocking waits (EventLog.wait's Thread.sleep loop,
      # semaphore waits, queue.sync) occupy the pool threads, and a
      # task suspended in a checked continuation whose resumer never
      # gets a thread wedges the run instead of failing one test.
      # Removing the stereo-file case from PlaybackEngineSmokeTests
      # (run #137) changed nothing, so that theory is dead.
      #
      # The PR #31 branch (updater-mirrors-settings-backup-v2) proved
      # the stall is load-dependent: its N-Z step ran 53 minutes and
      # passed 70 of 73 suites with steady progress, and
      # AccountIsolationTests passed alone. So the remainder is split
      # by suite-name initial (A-M / N-P / Q-S / T-Z, via --skip, so
      # any suite whose type name does not end in Tests still runs
      # instead of being dropped). The skip lists below are
      # REGENERATED from the current 129-suite enumeration — the #31
      # lists had drifted (8 suites ran in extra groups, 1 stale
      # entry) — and place this branch's 5 new suites
      # (AppearanceHexTests, LyricFilterTests, LyricMatchTests in A-M;
      # PlatformTrackLyricsTests in N-P; QQLyricDecryptTests in Q-S).
      # The two playback suites run in their own invocation because
      # they drive AVAudioEngine through runWithWatchdog; account
      # isolation runs alone because it was the first starvation
      # victim on the #31 branch. The 90-minute job cap is headroom
      # for the split's extra startup, not a fix for the hang: a
      # stalled run is silent indefinitely, so a higher cap alone
      # would only burn more minutes.
      - name: Test (account isolation)
        run: swift test --filter 'AccountIsolationTests'
      - name: Test (suites A-M)
        run: swift test --skip 'AccountIsolationTests|NavigationDestinationTests|NowPlayingArtworkStoreTests|OfflineArtworkTests|OfflineMetadataCleanupTests|OfflineStoreTests|OfflineUIFixtureTests|OutputRouteChangeDamperTests|OverloadTraceLineTests|PauseDrainTests|PlatformTrackLyricsTests|PlaybackEngineSmokeTests|PlaybackQueuePlanTests|PlaybackRepositoryTests|PlaybackRescheduleCheckTests|PlaybackStallCheckTests|PlaybackStartErrorCheckTests|PlaybackStateStorageTests|PlaylistAddErrorTests|PlaylistLoadingTests|PlaylistPublicationTests|PlaylistSearchTests|PreparedDeckTests|ProgressiveAudioBufferTests|ProgressiveLoaderFLACTests|QQLyricDecryptTests|QueueOrderAcquisitionTests|QueueOrderTests|QueuePrefetchTests|RecommendationTests|ReleaseCheckerDownloadTests|ScoreByteIdentityTests|ScoreCompilerTests|ScoreGridSelfCheckTests|ScoreRenderTests|ScoreSegmentAdmissionTests|ScoreTemplateSelectionTests|ScoreVettingTests|SeamAlignmentTests|SeamLatencyCalibrationTests|SeamReleaseTests|SegmentTimelineAlignmentTests|SettingsBackupTests|ShortcutSettingsTests|SlamAndTensionCutCompileTests|SleepTimerTests|StemEnvelopeTests|StemMetalResourcesTests|StemModelDownloaderStateTests|StemModelSpecTests|StemModelVerificationTests|StemPrerenderFieldSampleTests|StemPrerenderStartTests|StemTechniqueTests|StorageUsageTests|StructureSegmenterTests|SyncTests|TapCaptureThreadingTests|TapWriteLedgerTests|TempoRampTests|TestWatchdogTests|TrackAnalyzerTests|TrackTableTests|TransitionAimTests|TransitionAutomationTests|TransitionIntentTests|TransitionPlannerStructureTests|TransitionPlannerTests|TransitionScoreModelTests|TransitionSegmentTests|VinylRecordTests|VocalExchangeBothClocksTests|VocalHoldEQTests|WeightLoaderTests|WholeMixLaneTests'
      - name: Test (suites N-P)
        run: swift test --skip 'AccountIsolationTests|AdmissionGateTests|AnalysisStoreTests|AppearanceHexTests|AudioCacheEvictionTests|AudioCacheTests|AudioOutputDeviceTests|AudioSourceTrackMatcherTests|AuditionPlanOverrideTests|AutoMixDebugModelTests|AutoMixSettingsTests|AutomaticCacheLimitTests|BackgroundDownloadTransportTests|BeansCoverPaletteTests|BedIntroCompileTests|BedSplitTests|CDNHostTests|ChainCoherenceTests|CheckpointShapeTests|CustomAudioSourceTests|DeckChainDSPResetTests|DeckChainTimePitchBypassTests|DeviceIDTests|DistributionChannelTests|DownloadEligibilityTests|DownloadManagerTests|EngineAudioCacheDownloadTests|EngineDumpThrottleTests|EngineResurrectionSentinelTests|EngineTraceCoalesceTests|EngineTraceRenderTests|EngineTraceRingHygieneTests|EngineTraceRingTests|FoliaIOSPureLogicTests|FoliaMacPlaybackSettingsTests|FoliaMasterSwitchTests|FoliaPlaybackSettingsTests|GestureLibraryByteIdentityTests|HeadLatencyOverrideTests|HiddenAppWindowsTests|ImageCacheClearTests|ImageThumbnailTests|KumoneObjCTests|LatticePlayerTests|LayoutSizeClassTests|LoudnessCompensationTests|LoudnessMeterTests|LuminousPlayerTests|LyricFilterTests|LyricMatchTests|LyricsParserTests|LyricsSidecarTests|MasterLimiterTests|ModelManifestTests|ModelReleaseTests|PlaybackEngineSmokeTests|QQLyricDecryptTests|QueueOrderAcquisitionTests|QueueOrderTests|QueuePrefetchTests|RecommendationTests|ReleaseCheckerDownloadTests|ScoreByteIdentityTests|ScoreCompilerTests|ScoreGridSelfCheckTests|ScoreRenderTests|ScoreSegmentAdmissionTests|ScoreTemplateSelectionTests|ScoreVettingTests|SeamAlignmentTests|SeamLatencyCalibrationTests|SeamReleaseTests|SegmentTimelineAlignmentTests|SettingsBackupTests|ShortcutSettingsTests|SlamAndTensionCutCompileTests|SleepTimerTests|StemEnvelopeTests|StemMetalResourcesTests|StemModelDownloaderStateTests|StemModelSpecTests|StemModelVerificationTests|StemPrerenderFieldSampleTests|StemPrerenderStartTests|StemTechniqueTests|StorageUsageTests|StructureSegmenterTests|SyncTests|TapCaptureThreadingTests|TapWriteLedgerTests|TempoRampTests|TestWatchdogTests|TrackAnalyzerTests|TrackTableTests|TransitionAimTests|TransitionAutomationTests|TransitionIntentTests|TransitionPlannerStructureTests|TransitionPlannerTests|TransitionScoreModelTests|TransitionSegmentTests|VinylRecordTests|VocalExchangeBothClocksTests|VocalHoldEQTests|WeightLoaderTests|WholeMixLaneTests'
      - name: Test (suites Q-S)
        run: swift test --skip 'AccountIsolationTests|AdmissionGateTests|AnalysisStoreTests|AppearanceHexTests|AudioCacheEvictionTests|AudioCacheTests|AudioOutputDeviceTests|AudioSourceTrackMatcherTests|AuditionPlanOverrideTests|AutoMixDebugModelTests|AutoMixSettingsTests|AutomaticCacheLimitTests|BackgroundDownloadTransportTests|BeansCoverPaletteTests|BedIntroCompileTests|BedSplitTests|CDNHostTests|ChainCoherenceTests|CheckpointShapeTests|CustomAudioSourceTests|DeckChainDSPResetTests|DeckChainTimePitchBypassTests|DeviceIDTests|DistributionChannelTests|DownloadEligibilityTests|DownloadManagerTests|EngineAudioCacheDownloadTests|EngineDumpThrottleTests|EngineResurrectionSentinelTests|EngineTraceCoalesceTests|EngineTraceRenderTests|EngineTraceRingHygieneTests|EngineTraceRingTests|FoliaIOSPureLogicTests|FoliaMacPlaybackSettingsTests|FoliaMasterSwitchTests|FoliaPlaybackSettingsTests|GestureLibraryByteIdentityTests|HeadLatencyOverrideTests|HiddenAppWindowsTests|ImageCacheClearTests|ImageThumbnailTests|KumoneObjCTests|LatticePlayerTests|LayoutSizeClassTests|LoudnessCompensationTests|LoudnessMeterTests|LuminousPlayerTests|LyricFilterTests|LyricMatchTests|LyricsParserTests|LyricsSidecarTests|MasterLimiterTests|ModelManifestTests|ModelReleaseTests|NavigationDestinationTests|NowPlayingArtworkStoreTests|OfflineArtworkTests|OfflineMetadataCleanupTests|OfflineStoreTests|OfflineUIFixtureTests|OutputRouteChangeDamperTests|OverloadTraceLineTests|PauseDrainTests|PlatformTrackLyricsTests|PlaybackEngineSmokeTests|PlaybackQueuePlanTests|PlaybackRepositoryTests|PlaybackRescheduleCheckTests|PlaybackStallCheckTests|PlaybackStartErrorCheckTests|PlaybackStateStorageTests|PlaylistAddErrorTests|PlaylistLoadingTests|PlaylistPublicationTests|PlaylistSearchTests|PreparedDeckTests|ProgressiveAudioBufferTests|ProgressiveLoaderFLACTests|TapCaptureThreadingTests|TapWriteLedgerTests|TempoRampTests|TestWatchdogTests|TrackAnalyzerTests|TrackTableTests|TransitionAimTests|TransitionAutomationTests|TransitionIntentTests|TransitionPlannerStructureTests|TransitionPlannerTests|TransitionScoreModelTests|TransitionSegmentTests|VinylRecordTests|VocalExchangeBothClocksTests|VocalHoldEQTests|WeightLoaderTests|WholeMixLaneTests'
      - name: Test (suites T-Z)
        run: swift test --skip 'AccountIsolationTests|AdmissionGateTests|AnalysisStoreTests|AppearanceHexTests|AudioCacheEvictionTests|AudioCacheTests|AudioOutputDeviceTests|AudioSourceTrackMatcherTests|AuditionPlanOverrideTests|AutoMixDebugModelTests|AutoMixSettingsTests|AutomaticCacheLimitTests|BackgroundDownloadTransportTests|BeansCoverPaletteTests|BedIntroCompileTests|BedSplitTests|CDNHostTests|ChainCoherenceTests|CheckpointShapeTests|CustomAudioSourceTests|DeckChainDSPResetTests|DeckChainTimePitchBypassTests|DeviceIDTests|DistributionChannelTests|DownloadEligibilityTests|DownloadManagerTests|EngineAudioCacheDownloadTests|EngineDumpThrottleTests|EngineResurrectionSentinelTests|EngineTraceCoalesceTests|EngineTraceRenderTests|EngineTraceRingHygieneTests|EngineTraceRingTests|FoliaIOSPureLogicTests|FoliaMacPlaybackSettingsTests|FoliaMasterSwitchTests|FoliaPlaybackSettingsTests|GestureLibraryByteIdentityTests|HeadLatencyOverrideTests|HiddenAppWindowsTests|ImageCacheClearTests|ImageThumbnailTests|KumoneObjCTests|LatticePlayerTests|LayoutSizeClassTests|LoudnessCompensationTests|LoudnessMeterTests|LuminousPlayerTests|LyricFilterTests|LyricMatchTests|LyricsParserTests|LyricsSidecarTests|MasterLimiterTests|ModelManifestTests|ModelReleaseTests|NavigationDestinationTests|NowPlayingArtworkStoreTests|OfflineArtworkTests|OfflineMetadataCleanupTests|OfflineStoreTests|OfflineUIFixtureTests|OutputRouteChangeDamperTests|OverloadTraceLineTests|PauseDrainTests|PlatformTrackLyricsTests|PlaybackEngineSmokeTests|PlaybackQueuePlanTests|PlaybackRepositoryTests|PlaybackRescheduleCheckTests|PlaybackStallCheckTests|PlaybackStartErrorCheckTests|PlaybackStateStorageTests|PlaylistAddErrorTests|PlaylistLoadingTests|PlaylistPublicationTests|PlaylistSearchTests|PreparedDeckTests|ProgressiveAudioBufferTests|ProgressiveLoaderFLACTests|QQLyricDecryptTests|QueueOrderAcquisitionTests|QueueOrderTests|QueuePrefetchTests|RecommendationTests|ReleaseCheckerDownloadTests|ScoreByteIdentityTests|ScoreCompilerTests|ScoreGridSelfCheckTests|ScoreRenderTests|ScoreSegmentAdmissionTests|ScoreTemplateSelectionTests|ScoreVettingTests|SeamAlignmentTests|SeamLatencyCalibrationTests|SeamReleaseTests|SegmentTimelineAlignmentTests|SettingsBackupTests|ShortcutSettingsTests|SlamAndTensionCutCompileTests|SleepTimerTests|StemEnvelopeTests|StemMetalResourcesTests|StemModelDownloaderStateTests|StemModelSpecTests|StemModelVerificationTests|StemPrerenderFieldSampleTests|StemPrerenderStartTests|StemTechniqueTests|StorageUsageTests|StructureSegmenterTests|SyncTests|TransitionSegmentTests'

      - name: Test (playback suites)
        run: swift test --filter 'PlaybackEngineSmokeTests|TransitionSegmentTests'

      # Same invocation as release.yml, minus signing / notarization: the
      # script's own ad-hoc signature is all an unsigned build gets.
      - name: Build app (universal, unsigned)
        run: |
          ARCHES="arm64 x86_64" FETCH_MLX_METALLIB=1 \
            Scripts/build-app.sh release

      # Compile the iOS app shell unsigned. Same xcodebuild invocation as the
      # unsigned IPA workflow, without packaging; version overrides are
      # unnecessary for a compile check, so the xcconfig defaults apply.
      - name: Build iOS app (unsigned)
        run: |
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
