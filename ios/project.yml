# XcodeGen manifest for the iOS app shell.
# Regenerate the project with: cd ios && xcodegen generate
name: KumoneIOS
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  # Release plus App Store Connect signing, no sideload updater, CarPlay when
  # configured. Selected with `-configuration TestFlight` by Scripts/testflight.sh.
  TestFlight: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
  TestFlight: Config/TestFlight.xcconfig
packages:
  KumoneIOSPackage:
    path: KumoneIOSPackage
  # The root package, for the RumxsLiveActivityShared library product: the
  # Live Activity attributes type must live in one module imported by both
  # the app and the widget extension.
  kumone:
    path: ..
targets:
  KumoneIOS:
    type: application
    platform: iOS
    sources:
      - KumoneIOS
      - path: ../Sources/Kumone/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
      TestFlight: Config/TestFlight.xcconfig
    dependencies:
      - package: KumoneIOSPackage
        product: KumoneIOSFeature
    settings:
      base:
        # CODE_SIGN_ENTITLEMENTS is deliberately NOT set here. Target-level build
        # settings override xcconfig, which would pin the entitlements file and
        # silently defeat the CarPlay overlay in Config/Shared.xcconfig. The
        # setting lives there instead, behind $(KUMONE_ENTITLEMENTS_FILE).
        ENABLE_PREVIEWS: YES
  # Live Activity widget extension (Dynamic Island + lock screen). The
  # attributes type lives in the RumxsLiveActivityShared library product
  # of the root package, imported by both the app (via KumoneCore) and
  # this extension: ActivityKit matches an activity to its widget by the
  # attributes type's identity, so one shared module is required.
  # Deployment target is 16.1: Live Activities need 16.1 even though the
  # app itself supports 16.0.
  RumxsLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - RumxsLiveActivity
    dependencies:
      - package: kumone
        product: RumxsLiveActivityShared
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
      TestFlight: Config/TestFlight.xcconfig
    entitlements:
      path: Config/RumxsLiveActivity.entitlements
    info:
      path: RumxsLiveActivity/Info.plist
    settings:
      base:
        # Overrides for the xcconfig chain (Shared.xcconfig describes the
        # app): the extension has its own bundle ID, a 16.1 floor, its own
        # Info.plist used verbatim, and extension-only API.
        PRODUCT_BUNDLE_IDENTIFIER: sb.moe.kumone.LiveActivityWidget
        PRODUCT_NAME: RumxsLiveActivity
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  KumoneIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KumoneIOSUITests
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
      TestFlight: Config/Tests.xcconfig
    dependencies:
      - target: KumoneIOS
schemes:
  KumoneIOS:
    build:
      targets:
        KumoneIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KumoneIOSUITests
    archive:
      config: Release
